[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tpuscrape"
version = "0.1.0"
description = "GPU specifications scraper with anti-bot-aware, human-in-the-loop browsing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
tpuscrape = "tpuscrape.main:main"

[tool.setuptools]
packages = ["tpuscrape"]
